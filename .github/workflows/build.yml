name: Build and Test
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"
  release:
    types:
      - published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace }}/nuget

defaults:
  run:
    shell: sh

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore FactoryGenerator.sln
      - name: Build
        run: dotnet build FactoryGenerator.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --no-restore --configuration Release --solution FactoryGenerator.sln

  pack:
    runs-on: ubuntu-latest
    needs: [ build ]

    steps:
      - uses: actions/checkout@v4
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Compute version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
            informational="$version"
          else
            version="0.0.0"
            informational="UNRELEASED"
          fi
          # AssemblyVersion/FileVersion must be purely numeric: drop any prerelease/build suffix.
          numeric="${version%%[-+]*}"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "NUMERIC_VERSION=$numeric" >> "$GITHUB_ENV"
          echo "INFORMATIONAL_VERSION=$informational" >> "$GITHUB_ENV"
      - name: Pack
        run: |
          for project in \
            FactoryGenerator/FactoryGenerator.csproj \
            FactoryGenerator.Attributes/FactoryGenerator.Attributes.csproj \
            FactoryGenerator.Extensions.AspNetCore/FactoryGenerator.Extensions.AspNetCore.csproj; do
            dotnet pack "$project" --configuration Release -o "${{ env.NuGetDirectory }}" \
              --property:RepositoryCommit="${{ github.sha }}" \
              --property:InformationalVersion="$INFORMATIONAL_VERSION" \
              --property:AssemblyVersion="$NUMERIC_VERSION" \
              --property:FileVersion="$NUMERIC_VERSION" \
              --property:Version="$PACKAGE_VERSION" || exit 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.NuGetDirectory }}/*.nupkg

  deploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ pack ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ${{ env.NuGetDirectory }}
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish Nuget packages
        run: |
          for file in $(find "${{ env.NuGetDirectory }}" -type f -name "*.nupkg"); do
            dotnet nuget push "$file" --api-key "${{ secrets.NUGET_APIKEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate || exit 1
          done